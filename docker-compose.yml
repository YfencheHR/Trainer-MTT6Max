name: trainer-mtt-ia

services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: trainer-mtt-ia-app
    working_dir: /app
    # Al arrancar prepara sola la base de datos (migraciones pendientes + datos base si está vacía): ni al instalar ni
    # al actualizar hay que abrir una consola. Si algo falla, el aviso queda en los logs y la aplicación arranca igualmente.
    # --no-reload: sin esto, si existe app/.env el servidor descarta las variables del contenedor (APP_KEY incluida) y toda página da 500
    command:
      - sh
      - -c
      - "php artisan db:initialize || echo 'ATENCION - fallo al preparar la base de datos, revisa el log'; exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    volumes:
      - ./app:/app
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=trainer_mtt
      - DB_USERNAME=trainer
      - DB_PASSWORD=trainer_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=trainer-mtt
      - REVERB_APP_KEY=trainer-mtt-local-key
      - REVERB_APP_SECRET=trainer-mtt-local-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - REVERB_CLIENT_HOST=localhost
      - REVERB_CLIENT_PORT=8081
      - REVERB_CLIENT_SCHEME=http
      - REVERB_APP_MAX_MESSAGE_SIZE=50000
      - REVERB_MAX_REQUEST_SIZE=50000
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trainer-network

  # Laravel Reverb WebSocket server
  reverb:
    image: trainer-mtt-ia-app
    container_name: trainer-mtt-ia-reverb
    working_dir: /app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=trainer_mtt
      - DB_USERNAME=trainer
      - DB_PASSWORD=trainer_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=trainer-mtt
      - REVERB_APP_KEY=trainer-mtt-local-key
      - REVERB_APP_SECRET=trainer-mtt-local-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - REVERB_APP_MAX_MESSAGE_SIZE=50000
      - REVERB_MAX_REQUEST_SIZE=50000
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trainer-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: trainer-mtt-ia-postgres
    environment:
      POSTGRES_DB: trainer_mtt
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: trainer_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - trainer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: trainer-mtt-ia-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - trainer-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio Python de simulación de equity
  python-service:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: trainer-mtt-ia-python
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://ollama:11434
      - AI_TOOLS_OFF=${AI_TOOLS_OFF:-}
    volumes:
      - ./python:/app
    ports:
      - "127.0.0.1:5001:5000"
    depends_on:
      - app
      - ollama
    networks:
      - trainer-network

  # Modelo de IA local que decide por los bots. Todo dentro de Docker; la tarjeta NVIDIA se le da con docker-compose.gpu.yml
  ollama:
    image: ollama/ollama:latest
    container_name: trainer-mtt-ia-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - trainer-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  trainer-network:
    driver: bridge
