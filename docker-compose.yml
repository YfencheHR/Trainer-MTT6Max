version: '3.8'

services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: trainer-mtt-app
    working_dir: /app
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=trainer_mtt
      - DB_USERNAME=trainer
      - DB_PASSWORD=trainer_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=trainer-mtt
      - REVERB_APP_KEY=trainer-mtt-local-key
      - REVERB_APP_SECRET=trainer-mtt-local-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - REVERB_CLIENT_HOST=localhost
      - REVERB_CLIENT_PORT=8080
      - REVERB_CLIENT_SCHEME=http
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trainer-network

  # Laravel Reverb WebSocket server
  reverb:
    image: trainer-mtt-app
    container_name: trainer-mtt-reverb
    working_dir: /app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=trainer_mtt
      - DB_USERNAME=trainer
      - DB_PASSWORD=trainer_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=trainer-mtt
      - REVERB_APP_KEY=trainer-mtt-local-key
      - REVERB_APP_SECRET=trainer-mtt-local-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trainer-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: trainer-mtt-postgres
    environment:
      POSTGRES_DB: trainer_mtt
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: trainer_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - trainer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: trainer-mtt-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trainer-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio Python de simulación de equity
  python-service:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: trainer-mtt-python
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./python:/app
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - app
    networks:
      - trainer-network

volumes:
  postgres_data:
  redis_data:

networks:
  trainer-network:
    driver: bridge
