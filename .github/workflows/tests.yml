name: Tests

# Se ejecuta en cada push a main y en cada pull request: las pruebas de Laravel (con PostgreSQL) y las del servicio Python.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: trainer_mtt_test
          POSTGRES_USER: trainer
          POSTGRES_PASSWORD: trainer_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trainer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: trainer
      DB_PASSWORD: trainer_password
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pcntl, zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: touch .env
      - run: php artisan test

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
